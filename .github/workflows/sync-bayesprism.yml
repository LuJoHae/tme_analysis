name: Sync BayesPrism to Standalone Repository

on:
  push:
    branches:
      - main
    paths:
      - "packages/bayesprism/**"
      - ".github/workflows/sync-bayesprism.yml"
  workflow_dispatch:

jobs:
  sync-bayesprism:
    name: Sync to LuJoHae/bayesprism-python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.BAYESPRISM_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          echo "GIT_SSH_COMMAND=ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" >> $GITHUB_ENV

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync files to Standalone Repo
        run: |
          git clone git@github.com:LuJoHae/bayesprism-python.git /tmp/standalone
          rsync -av --delete --exclude=".git" --exclude=".github" packages/bayesprism/ /tmp/standalone/
          cd /tmp/standalone
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "sync(bayesprism): mirror updates from monorepo"
            git push origin main
          else
            echo "No changes to sync."
          fi
