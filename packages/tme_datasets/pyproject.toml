[project]
name = "tme_datasets"
version = "0.1.0"
description = "Unified single-cell, spatial, bulk immunotherapy datasets, gene sets, and perturbation framework for TME analysis"
requires-python = ">=3.11"
dependencies = [
    "anndata>=0.10.0",
    "scanpy>=1.9.0",
    "polars>=0.20.0",
    "returns>=0.22.0",
    "pydantic>=2.5.0",
    "scipy>=1.11.0",
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "zarr>=2.16.0",
    "scikit-learn>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
