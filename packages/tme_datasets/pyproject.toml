[project]
name = "tme_datasets"
version = "0.1.0"
description = "Unified single-cell, spatial, bulk immunotherapy datasets, gene sets, and perturbation framework for TME analysis"
requires-python = ">=3.11"
dependencies = [
    "anndata>=0.10.0",
    "h5py>=3.10.0",
    "pandas>=2.0.0",
    "scanpy>=1.9.0",
    "polars>=0.20.0",
    "returns>=0.22.0",
    "pydantic>=2.5.0",
    "scipy>=1.11.0",
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "zarr>=2.16.0",
    "scikit-learn>=1.3.0",
    "pyensembl>=2.3.0",
    "mygene>=3.2.0",
    "gdown>=5.1.0",
    "harmonypy==0.0.10",
    "psutil>=5.9.0",
]

[project.scripts]
tme-datasets-ingest = "tme_datasets.pipeline.download_preprocess:main"
tme-datasets-batch-preprocess = "tme_datasets.pipeline.batch_preprocess:main"
tme-datasets-qc = "tme_datasets.pipeline.qc_orchestrator:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
