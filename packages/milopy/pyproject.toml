[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "milopy"
version = "0.3.0"
description = "A native Python implementation of miloR for differential abundance testing"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "LuJoHae", email = "lukas.j.haeuser@gmail.com" }
]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scanpy",
    "anndata",
    "edgepython",
    "patsy",
    "polars>=0.20.0",
    "pydantic>=2.0.0",
    "returns>=0.22.0",
    "harmonypy==0.0.10",
    "firthmodels>=0.7.2",
    "igraph>=1.0.0",
    "altair>=5.0.0",
]

[project.optional-dependencies]
test = [
    "pytest",
    "hypothesis>=6.100.0",
    "mypy>=1.10.0",
    "rpy2",
    "anndata2ri"
]

[tool.mypy]
python_version = "3.14"

[[tool.mypy.overrides]]
module = ["milopy.pairwise.*"]
strict = true

[[tool.mypy.overrides]]
module = [
    "anndata.*",
    "scipy.*",
    "igraph.*",
    "firthmodels.*",
    "edgepython.*",
    "altair.*",
]
ignore_missing_imports = true

[project.urls]
Homepage = "https://github.com/LuJoHae/milopy"
Repository = "https://github.com/LuJoHae/milopy.git"
