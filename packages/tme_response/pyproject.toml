[project]
name = "tme_response"
version = "0.1.0"
description = "Multi-omic immune checkpoint response prediction and systematic benchmarking framework"
requires-python = ">=3.11"
dependencies = [
    "tme_datasets",
    "anndata>=0.10.0",
    "polars>=0.20.0",
    "returns>=0.22.0",
    "pydantic>=2.5.0",
    "scipy>=1.11.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "altair>=5.2.0",
    "vl-convert-python>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tme_response"]
